server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compressió gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # ---- Proxy al backend per a totes les crides /api/ ----
    # IMPORTANT: location més específic va primer, té prioritat sobre "/"
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Admin-Password $http_x_admin_password;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
    }

    # ---- Service Worker amb scope correcte ----
    location = /sw.js {
        add_header Service-Worker-Allowed /;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ---- Fitxers estàtics (SPA fallback) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
