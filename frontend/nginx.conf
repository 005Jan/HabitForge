server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compressió gzip
    gzip on;
    gzip_types text/css application/javascript application/json;

    # ---- Proxy al backend per a totes les crides /api/ ----
    # IMPORTANT: location més específic va primer, té prioritat sobre "/"
    #
    # El nom del backend va per variable a posta. Amb `proxy_pass
    # http://backend:3000;` nginx resol el DNS UNA SOLA VEGADA en arrencar i es
    # queda la IP per sempre. El dia que es recrea el contenidor del backend
    # (qualsevol `compose up -d --build backend`) la IP canvia i el frontend
    # serveix 502 contra la IP vella fins que el reinicies a mà. Amb una
    # variable, nginx torna a resoldre fent servir el DNS intern de Docker.
    # $request_uri és obligatori: amb variable, nginx ja no afegeix la ruta sol.
    location /api/ {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set $backend_host  backend;
        proxy_pass         http://$backend_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Admin-Password $http_x_admin_password;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
    }

    # ---- Service Worker amb scope correcte ----
    location = /sw.js {
        add_header Service-Worker-Allowed /;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ---- Fitxers estàtics (SPA fallback) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
