services:

  # ---- BASE DE DADES MariaDB ----
  database:
    image: mariadb:10.11
    platform: linux/arm64
    container_name: habitforge_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-habitforge}
      MYSQL_USER: ${MYSQL_USER:-habitforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme_root}" ]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 180s

  # ---- BACKEND Node.js + Express ----
  backend:
    build: ./backend
    container_name: habitforge_backend
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-habitforge}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      DB_NAME: ${MYSQL_DATABASE:-habitforge}
      PORT: 3000
      TZ: ${TZ:-Europe/Madrid}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- FRONTEND nginx ----
  frontend:
    build: ./frontend
    container_name: habitforge_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - proxy_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.habitforge.rule=Host(`${HABITFORGE_HOST:-localhost}`) && PathPrefix(`/habits`)
      - traefik.http.routers.habitforge.entrypoints=websecure
      - traefik.http.routers.habitforge.tls.certresolver=letsencrypt
      - traefik.http.routers.habitforge.middlewares=habitforge-strip
      - traefik.http.middlewares.habitforge-strip.stripprefix.prefixes=/habits
      - traefik.http.services.habitforge.loadbalancer.server.port=80

volumes:
  db_data:

networks:
  default:
  proxy_net:
    external: true
